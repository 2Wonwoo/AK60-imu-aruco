four_wheel_drive_node:
  ros__parameters:
    can_interface: can1
    # Measure these two values before odometry/Nav2 integration.
    wheel_radius: 0.10
    track_width: 0.50
    max_wheel_velocity: 2.0
    # MIT 모드에서 kp=0 이므로 토크 = kd x (목표속도 - 현재속도) 다.
    # 즉 kd 가 곧 구동 토크를 정한다. 1.0 에서는 자세 복원 속도(0.6 rad/s)로
    # 겨우 0.6 N*m 이라 바퀴가 거의 움직이지 않았다.
    # 실측(후진 1.0 rad/s, 3초간 위치 변화): 1.0 -> +106, 2.0 -> +541,
    # 3.5 -> +1160, 5.0 -> +1306. 3.5 부터는 모터가 명령 속도를 따라잡아
    # 증가폭이 줄어든다. 프로토콜 상한은 5.0.
    kd: 3.5
    control_rate: 50.0
    command_timeout: 0.5

